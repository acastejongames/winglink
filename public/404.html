<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WingLink</title>
    <script>
      /* GitHub Pages SPA fallback (spa-github-pages).
         GitHub Pages serves this file with a 404 for any unknown path
         (e.g. /winglink/profile/username on a hard refresh). Redirect to the
         index with the path encoded in the query string; index.html decodes it.
         pathSegmentsToKeep = 1 → the repository name segment (/winglink/). */
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body>
    <noscript>WingLink requires JavaScript to run.</noscript>
  </body>
</html>
