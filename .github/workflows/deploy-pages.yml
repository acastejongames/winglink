name: Deploy to GitHub Pages

on:
  push:
    branches:
      - arena/d4554afa-winglink
  workflow_dispatch:
    inputs:
      auth_probe:
        description: 'Attempt a real Supabase signup to diagnose auth errors'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Cloud backend credentials — PUBLIC BY DESIGN (Supabase anon key ships
      # in every browser bundle; RLS is the real gatekeeper). Never commit the
      # service_role key or the database password.
      VITE_SUPABASE_URL: https://biftqxkjposufelwduzw.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpZnRxeGtqcG9zdWZlbHdkdXp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NjQ0MjcsImV4cCI6MjEwOTE0MDQyN30.GbHvbJSpcIPZSZbb0Rx8EYixfpl4URHymANEUQKw9kE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          # Tests always exercise the local vault mode.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''

      - name: Verify Supabase backend
        if: env.VITE_SUPABASE_URL != ''
        run: |
          set -uo pipefail
          echo "── Table probe (anon; 200 = exists, 404 = missing) ──"
          missing=0
          report=""
          for t in profiles posts comments comment_likes reactions poll_votes \
                   follows friendships friend_requests blocks reports \
                   communities community_members conversations conversation_members \
                   messages notifications quiz_records challenge_progress; do
            code=$(curl -s -o /tmp/sb.json -w '%{http_code}' \
              -H "apikey: ${VITE_SUPABASE_ANON_KEY}" \
              "${VITE_SUPABASE_URL}/rest/v1/${t}?limit=1" || echo 000)
            if [ "${code}" = "200" ]; then
              echo "OK   ${t}"
            elif [ "${code}" = "404" ]; then
              echo "MISS ${t}"
              echo "::error title=Missing table::${t} — 404, not in schema. Re-run supabase/schema.sql."
              missing=1
            else
              echo "ERR  ${t} HTTP ${code} $(head -c 200 /tmp/sb.json)"
              echo "::error title=Table error::${t} → HTTP ${code}: $(head -c 200 /tmp/sb.json)"
              missing=1
            fi
          done
          echo "── RPC probe (informational: anon has no EXECUTE grant, 404 expected) ──"
          code=$(curl -s -o /tmp/sb.json -w '%{http_code}' -X POST \
            -H "apikey: ${VITE_SUPABASE_ANON_KEY}" -H "Content-Type: application/json" \
            "${VITE_SUPABASE_URL}/rest/v1/rpc/ensure_dm" -d '{}' || echo 000)
          echo "rpc ensure_dm as anon → HTTP ${code} $(head -c 160 /tmp/sb.json)"
          if [ "${missing}" != "0" ]; then
            echo "::error title=Backend schema incomplete::See the per-table annotations above — re-run the FULL supabase/schema.sql in the SQL Editor (check the first error in its results)."
            exit 1
          fi
          echo "✓ Supabase: all tables + RPCs present"

      - name: Auth signup probe (on-demand)
        if: (github.event_name == 'workflow_dispatch' && inputs.auth_probe) || contains(github.event.head_commit.message, '[auth-probe]')
        run: |
          set -uo pipefail
          PROBE_EMAIL="winglink-ci-probe-${GITHUB_RUN_ID}@example.com"
          echo "Signing up probe user ${PROBE_EMAIL} …"
          code=$(curl -s -o /tmp/signup.json -w '%{http_code}' -X POST \
            -H "apikey: ${VITE_SUPABASE_ANON_KEY}" -H "Content-Type: application/json" \
            "${VITE_SUPABASE_URL}/auth/v1/signup" \
            -d "{\"email\": \"${PROBE_EMAIL}\", \"password\": \"CiProbe-Passw0rd-2026\", \"data\": {\"username\": \"ci_probe_${GITHUB_RUN_ID}\", \"display_name\": \"CI Probe\", \"interests\": []}}")
          echo "signup → HTTP ${code}"
          cat /tmp/signup.json | head -c 600
          echo
          BODY=$(head -c 400 /tmp/signup.json | tr '\n' ' ')
          TOKEN=$(sed -n 's/.*\"access_token\":\"\([^\"]*\)\".*/\1/p' /tmp/signup.json)
          if [ -n "${TOKEN}" ]; then
            echo "── Authenticated sweep (replicates the app's bootstrap) ──"
            fails=0
            sweep() {
              local label="$1"; shift
              local code
              code=$(curl -s -o /tmp/sw.json -w '%{http_code}' \
                -H "apikey: ${VITE_SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${TOKEN}" "$@")
              if [ "${code}" = "200" ]; then
                echo "OK   ${label}"
              else
                echo "FAIL ${label} → HTTP ${code} $(head -c 300 /tmp/sw.json)"
                echo "::error title=Bootstrap query failed::${label} → HTTP ${code}: $(head -c 300 /tmp/sw.json | tr '\n' ' ')"
                fails=1
              fi
            }
            sweep "profiles"        "${VITE_SUPABASE_URL}/rest/v1/profiles?select=*&limit=2000"
            sweep "posts"           "${VITE_SUPABASE_URL}/rest/v1/posts?select=*&order=created_at.desc&limit=150"
            sweep "comments"        "${VITE_SUPABASE_URL}/rest/v1/comments?select=*&limit=1000"
            sweep "reactions"       "${VITE_SUPABASE_URL}/rest/v1/reactions?select=*&limit=3000"
            sweep "comment_likes"   "${VITE_SUPABASE_URL}/rest/v1/comment_likes?select=*&limit=3000"
            sweep "poll_votes"      "${VITE_SUPABASE_URL}/rest/v1/poll_votes?select=*&limit=300"
            sweep "follows"         "${VITE_SUPABASE_URL}/rest/v1/follows?select=*&limit=5000"
            sweep "friend_requests" "${VITE_SUPABASE_URL}/rest/v1/friend_requests?select=*&limit=5000"
            sweep "friendships"     "${VITE_SUPABASE_URL}/rest/v1/friendships?select=*&limit=5000"
            sweep "blocks"          "${VITE_SUPABASE_URL}/rest/v1/blocks?select=*&limit=5000"
            sweep "communities"     "${VITE_SUPABASE_URL}/rest/v1/communities?select=*&limit=500"
            sweep "community_members" "${VITE_SUPABASE_URL}/rest/v1/community_members?select=*&limit=5000"
            sweep "conversations"   "${VITE_SUPABASE_URL}/rest/v1/conversations?select=*&limit=500"
            sweep "conversation_members" "${VITE_SUPABASE_URL}/rest/v1/conversation_members?select=*&limit=5000"
            sweep "messages"        "${VITE_SUPABASE_URL}/rest/v1/messages?select=*&order=created_at.asc&limit=1000"
            sweep "notifications"   "${VITE_SUPABASE_URL}/rest/v1/notifications?select=*&order=created_at.desc&limit=100"
            sweep "quiz_records"    "${VITE_SUPABASE_URL}/rest/v1/quiz_records?select=*&order=played_at.desc&limit=500"
            if [ "${fails}" != "0" ]; then
              echo "::error title=Bootstrap broken::One or more startup queries fail with a real session."
              exit 1
            fi
            echo "✓ all bootstrap queries OK with a real session"

            echo "── Publish flow (the user's failing action) ──"
            UID1=$(curl -s -H "apikey: ${VITE_SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${TOKEN}" \
              "${VITE_SUPABASE_URL}/auth/v1/user" | sed -n 's/.*\"id\":\"\([0-9a-f-]\{36\}\)\".*/\1/p' | head -1)
            echo "probe user: ${UID1}"

            # 1) text post
            code=$(curl -s -o /tmp/post.json -w '%{http_code}' -X POST \
              -H "apikey: ${VITE_SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" -H "Prefer: return=representation" \
              "${VITE_SUPABASE_URL}/rest/v1/posts" \
              -d "{\"author_id\":\"${UID1}\",\"type\":\"text\",\"text\":\"CI probe post\",\"images\":[],\"visibility\":\"public\",\"hashtags\":[],\"mentions\":[]}")
            if [ "${code}" = "201" ]; then
              echo "OK   text post insert (201)"
            else
              echo "FAIL text post → HTTP ${code} $(head -c 400 /tmp/post.json)"
              echo "::error title=Post insert failed::HTTP ${code}: $(head -c 400 /tmp/post.json | tr '\n' ' ')"
              exit 1
            fi
            PID=$(sed -n 's/.*\"id\":\"\([0-9a-f-]\{36\}\)\".*/\1/p' /tmp/post.json | head -1)

            # 2) image upload to storage
            printf '\x89PNG\r\n\x1a\n' > /tmp/probe.png
            code=$(curl -s -o /tmp/up.json -w '%{http_code}' -X POST \
              -H "apikey: ${VITE_SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: image/png" \
              --data-binary @/tmp/probe.png \
              "${VITE_SUPABASE_URL}/storage/v1/object/media/${UID1}/probe.png")
            if [ "${code}" = "200" ]; then
              echo "OK   storage upload (200)"
            else
              echo "FAIL storage upload → HTTP ${code} $(head -c 300 /tmp/up.json)"
              echo "::error title=Storage upload failed::HTTP ${code}: $(head -c 300 /tmp/up.json | tr '\n' ' ')"
            fi

            # 3) second account must SEE the post (cross-user visibility)
            PROBE2_EMAIL="winglink-ci-reader-${GITHUB_RUN_ID}@example.com"
            code=$(curl -s -o /tmp/su2.json -w '%{http_code}' -X POST \
              -H "apikey: ${VITE_SUPABASE_ANON_KEY}" -H "Content-Type: application/json" \
              "${VITE_SUPABASE_URL}/auth/v1/signup" \
              -d "{\"email\": \"${PROBE2_EMAIL}\", \"password\": \"CiProbe-Passw0rd-2026\", \"data\": {\"username\": \"ci_reader_${GITHUB_RUN_ID}\", \"display_name\": \"CI Reader\", \"interests\": []}}")
            TOKEN2=$(sed -n 's/.*\"access_token\":\"\([^\"]*\)\".*/\1/p' /tmp/su2.json)
            if [ -n "${TOKEN2}" ]; then
              code=$(curl -s -o /tmp/vis.json -w '%{http_code}' \
                -H "apikey: ${VITE_SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${TOKEN2}" \
                "${VITE_SUPABASE_URL}/rest/v1/posts?id=eq.${PID}&select=id")
              if [ "${code}" = "200" ] && grep -q "${PID}" /tmp/vis.json; then
                echo "OK   cross-user visibility (second account sees the post)"
              else
                echo "FAIL cross-user visibility → HTTP ${code} $(head -c 300 /tmp/vis.json)"
                echo "::error title=Post invisible to other users::HTTP ${code}: $(head -c 300 /tmp/vis.json | tr '\n' ' ')"
              fi
            else
              echo "::warning title=Second signup::could not create reader account (rate limit?) — visibility check skipped"
            fi

            # cleanup probe rows
            [ -n "${PID}" ] && curl -s -o /dev/null -X DELETE \
              -H "apikey: ${VITE_SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${TOKEN}" \
              "${VITE_SUPABASE_URL}/rest/v1/posts?id=eq.${PID}"
            curl -s -o /dev/null -X DELETE \
              -H "apikey: ${VITE_SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${TOKEN}" \
              "${VITE_SUPABASE_URL}/storage/v1/object/media/${UID1}/probe.png"
            echo "✓ publish flow checked"
          else
            echo "::warning title=No token::signup response had no access_token — sweep skipped"
          fi
          if grep -qi "database error" /tmp/signup.json; then
            echo "::error title=Signup broken::GoTrue cannot create the user (DB trigger failing): ${BODY} — re-run supabase/schema.sql."
            exit 1
          fi
          if [ "${code}" = "200" ] || [ "${code}" = "201" ]; then
            echo "::notice title=Signup OK::Probe signup succeeded: ${BODY}"
          else
            echo "::error title=Signup rejected::HTTP ${code}: ${BODY}"
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          # GitHub Pages serves project sites from /winglink/
          VITE_BASE: /winglink/
          OG_IMAGE: https://acastejongames.github.io/winglink/images/f22-sunset.jpg

      - name: Assert CSP allows Supabase origins
        if: env.VITE_SUPABASE_URL != ''
        run: |
          REF=$(echo "${VITE_SUPABASE_URL}" | sed -E 's#https?://##')
          if ! grep -q "connect-src 'self' https://${REF} wss://${REF}" dist/index.html; then
            echo "::error::Production CSP is missing Supabase connect-src (https+wss) for ${REF} — all backend calls would be blocked by the browser."
            exit 1
          fi
          if ! grep -q "img-src .*https://${REF}" dist/index.html; then
            echo "::error::Production CSP is missing Supabase img-src for ${REF} — storage images would be blocked."
            exit 1
          fi
          echo "✓ CSP allows https://${REF} + wss://${REF}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
