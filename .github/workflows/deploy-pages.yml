name: Deploy to GitHub Pages

on:
  push:
    branches:
      - arena/d4554afa-winglink
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Cloud backend credentials — PUBLIC BY DESIGN (Supabase anon key ships
      # in every browser bundle; RLS is the real gatekeeper). Never commit the
      # service_role key or the database password.
      VITE_SUPABASE_URL: https://biftqxkjposufelwduzw.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpZnRxeGtqcG9zdWZlbHdkdXp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NjQ0MjcsImV4cCI6MjEwOTE0MDQyN30.GbHvbJSpcIPZSZbb0Rx8EYixfpl4URHymANEUQKw9kE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify Supabase backend
        if: env.VITE_SUPABASE_URL != ''
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/sb.json -w '%{http_code}' \
            -H "apikey: ${VITE_SUPABASE_ANON_KEY}" \
            "${VITE_SUPABASE_URL}/rest/v1/profiles?limit=1")
          echo "GET /rest/v1/profiles → HTTP ${code}"
          if [ "${code}" = "404" ]; then
            echo "::error::Supabase schema is NOT applied yet. Paste supabase/schema.sql into the SQL Editor and re-run."
            exit 1
          fi
          if [ "${code}" != "200" ]; then
            echo "::error::Unexpected Supabase response:"
            cat /tmp/sb.json
            exit 1
          fi
          echo "✓ Supabase reachable, schema applied"

      - name: Build
        run: npm run build
        env:
          # GitHub Pages serves project sites from /winglink/
          VITE_BASE: /winglink/
          OG_IMAGE: https://acastejongames.github.io/winglink/images/f22-sunset.jpg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
