name: Deploy to GitHub Pages

on:
  push:
    branches:
      - arena/d4554afa-winglink
  workflow_dispatch:
    inputs:
      auth_probe:
        description: 'Attempt a real Supabase signup to diagnose auth errors'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Cloud backend credentials — PUBLIC BY DESIGN (Supabase anon key ships
      # in every browser bundle; RLS is the real gatekeeper). Never commit the
      # service_role key or the database password.
      VITE_SUPABASE_URL: https://biftqxkjposufelwduzw.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpZnRxeGtqcG9zdWZlbHdkdXp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NjQ0MjcsImV4cCI6MjEwOTE0MDQyN30.GbHvbJSpcIPZSZbb0Rx8EYixfpl4URHymANEUQKw9kE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          # Tests always exercise the local vault mode.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''

      - name: Verify Supabase backend
        if: env.VITE_SUPABASE_URL != ''
        run: |
          set -uo pipefail
          echo "── Table probe (anon; 200 = exists, 404 = missing) ──"
          missing=0
          report=""
          for t in profiles posts comments comment_likes reactions poll_votes \
                   follows friendships friend_requests blocks reports \
                   communities community_members conversations conversation_members \
                   messages notifications quiz_records challenge_progress; do
            code=$(curl -s -o /tmp/sb.json -w '%{http_code}' \
              -H "apikey: ${VITE_SUPABASE_ANON_KEY}" \
              "${VITE_SUPABASE_URL}/rest/v1/${t}?limit=1" || echo 000)
            if [ "${code}" = "200" ]; then
              echo "OK   ${t}"
            elif [ "${code}" = "404" ]; then
              echo "MISS ${t}"
              echo "::error title=Missing table::${t} — 404, not in schema. Re-run supabase/schema.sql."
              missing=1
            else
              echo "ERR  ${t} HTTP ${code} $(head -c 200 /tmp/sb.json)"
              echo "::error title=Table error::${t} → HTTP ${code}: $(head -c 200 /tmp/sb.json)"
              missing=1
            fi
          done
          echo "── RPC probe (informational: anon has no EXECUTE grant, 404 expected) ──"
          code=$(curl -s -o /tmp/sb.json -w '%{http_code}' -X POST \
            -H "apikey: ${VITE_SUPABASE_ANON_KEY}" -H "Content-Type: application/json" \
            "${VITE_SUPABASE_URL}/rest/v1/rpc/ensure_dm" -d '{}' || echo 000)
          echo "rpc ensure_dm as anon → HTTP ${code} $(head -c 160 /tmp/sb.json)"
          if [ "${missing}" != "0" ]; then
            echo "::error title=Backend schema incomplete::See the per-table annotations above — re-run the FULL supabase/schema.sql in the SQL Editor (check the first error in its results)."
            exit 1
          fi
          echo "✓ Supabase: all tables + RPCs present"

      - name: Auth signup probe (on-demand)
        if: github.event_name == 'workflow_dispatch' && inputs.auth_probe
        run: |
          set -uo pipefail
          PROBE_EMAIL="winglink-ci-probe-${GITHUB_RUN_ID}@example.com"
          echo "Signing up probe user ${PROBE_EMAIL} …"
          code=$(curl -s -o /tmp/signup.json -w '%{http_code}' -X POST \
            -H "apikey: ${VITE_SUPABASE_ANON_KEY}" -H "Content-Type: application/json" \
            "${VITE_SUPABASE_URL}/auth/v1/signup" \
            -d "{\"email\": \"${PROBE_EMAIL}\", \"password\": \"CiProbe-Passw0rd-2026\", \"data\": {\"username\": \"ci_probe_${GITHUB_RUN_ID}\", \"display_name\": \"CI Probe\", \"interests\": []}}")
          echo "signup → HTTP ${code}"
          cat /tmp/signup.json | head -c 600
          echo
          BODY=$(head -c 400 /tmp/signup.json | tr '\n' ' ')
          if grep -qi "database error" /tmp/signup.json; then
            echo "::error title=Signup broken::GoTrue cannot create the user (DB trigger failing): ${BODY} — re-run supabase/schema.sql."
            exit 1
          fi
          if [ "${code}" = "200" ] || [ "${code}" = "201" ]; then
            echo "::notice title=Signup OK::Probe signup succeeded: ${BODY}"
          else
            echo "::error title=Signup rejected::HTTP ${code}: ${BODY}"
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          # GitHub Pages serves project sites from /winglink/
          VITE_BASE: /winglink/
          OG_IMAGE: https://acastejongames.github.io/winglink/images/f22-sunset.jpg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
