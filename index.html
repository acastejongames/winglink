<!doctype html>
<html lang="en" class="dark">
  <head>
    <base href="%BASE_HREF%" />
    <script>
      /* GitHub Pages SPA fallback (spa-github-pages): when a deep link was
         redirected through 404.html as /?/path, restore the real path so
         react-router sees it. */
      ;(function (l) {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WingLink — Where Aviation Connects. The international social network for aviation enthusiasts: spotters, pilots, simmers and historians."
    />
    <meta name="theme-color" content="#101D30" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WingLink" />
    <meta property="og:title" content="WingLink — Where Aviation Connects" />
    <meta property="og:description" content="The international social network for aviation enthusiasts: spotters, pilots, simmers and historians." />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WingLink — Where Aviation Connects" />
    <meta name="twitter:description" content="The international social network for aviation enthusiasts: spotters, pilots, simmers and historians." />
    <meta name="twitter:image" content="%OG_IMAGE%" />
    <title>WingLink — Where Aviation Connects</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
